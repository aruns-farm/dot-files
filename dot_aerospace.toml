# AeroSpace config
# Docs: https://nikitabobko.github.io/AeroSpace/guide
# Managed via chezmoi — source: ~/Documents/dot-files/dot_aerospace.toml → ~/.aerospace.toml

after-startup-command = [
  'exec-and-forget open -a "Google Chrome"',
  'exec-and-forget open -a "Cursor"',
  'exec-and-forget open -a "iterm2"',
  'exec-and-forget open -a "Slack"',
  'exec-and-forget open -a "Spotify"',
]

start-at-login = true

[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

[mode.main.binding]
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'

alt-shift-semicolon = 'mode service'
alt-slash           = 'layout tiles horizontal vertical'
alt-comma           = 'layout accordion horizontal vertical'

alt-minus      = 'resize smart -50'
alt-equal      = 'resize smart +50'

alt-shift-space = 'layout floating tiling'
alt-f           = 'fullscreen'

[mode.service.binding]
esc       = 'mode main'
r         = ['reload-config', 'mode main']
backspace = 'close-all-windows-but-current'
alt-shift-h = 'join-with left'
alt-shift-j = 'join-with down'
alt-shift-k = 'join-with up'
alt-shift-l = 'join-with right'

# ── Workspace 1: Chrome only ─────────────────────────────────────────────────
# Any Chrome window → workspace 1
[[on-window-detected]]
if.app-name-regex-substring = 'Google Chrome'
run = 'move-node-to-workspace 1'

# Any non-Chrome window that lands on workspace 1 gets bounced to workspace 5.
# This handles apps opened manually while workspace 1 is focused.
[[on-window-detected]]
if.workspace = '1'
run = 'move-node-to-workspace 5'

# ── Workspace 2: Editor ───────────────────────────────────────────────────────
[[on-window-detected]]
if.app-name-regex-substring = 'Cursor'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-name-regex-substring = 'Code'
run = 'move-node-to-workspace 2'

# ── Workspace 3: Terminal ─────────────────────────────────────────────────────
[[on-window-detected]]
if.app-name-regex-substring = 'Terminal'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-name-regex-substring = 'iTerm'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-name-regex-substring = 'Ghostty'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-name-regex-substring = 'Warp'
run = 'move-node-to-workspace 3'

# ── Workspace 4: Comms + Music ────────────────────────────────────────────────
[[on-window-detected]]
if.app-name-regex-substring = 'Slack'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-name-regex-substring = 'Spotify'
run = 'move-node-to-workspace 4'
